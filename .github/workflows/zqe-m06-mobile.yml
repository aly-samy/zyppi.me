name: ZQE M06 Mobile Gate

on:
  pull_request:
    paths:
      - "packages/qr-core/**"
      - "packages/qr-svg/**"
      - "tools/zqe/**"
      - ".github/workflows/zqe-m06-mobile.yml"
  workflow_dispatch:

jobs:
  android-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.19.0
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"

      - name: Setup pnpm 10.30.3
        uses: pnpm/action-setup@v4
        with:
          version: "10.30.3"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production QR packages
        run: |
          pnpm --filter @zyppi/qr-core build
          pnpm --filter @zyppi/qr-svg build

      - name: Generate Android Mobile Test Fixtures
        run: pnpm exec vitest run tools/zqe/m06/generate-mobile-fixtures.test.ts

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify KVM availability
        run: |
          test -e /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Make Gradle Wrapper Executable
        run: chmod +x tools/zqe/mobile/android/gradlew

      - name: Run Android ML Kit Instrumentation Tests on API 35 Emulator
        # ReactiveCircus/android-emulator-runner v2
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-linux-hw-accel: false
          script: cd tools/zqe/mobile/android && ./gradlew connectedCheck
